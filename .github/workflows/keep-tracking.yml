# Keeps reading analytics on teerth.blog after every Astro deploy.
# The Astro source isn't in this repo, so a fresh build drops track.js,
# the privacy page and the footer link. This puts them back.
# Safe to delete once the Astro layout itself includes them.
name: keep-tracking
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore tracker, privacy page and IndexNow key
        run: |
          for f in .github/keep/*; do
            n=$(basename "$f")
            cmp -s "$f" "$n" || cp "$f" "$n"
          done
          python3 - <<'EOF'
          import glob
          for f in glob.glob('*.html'):
              if f == 'privacy.html':
                  continue
              s = o = open(f).read()
              if 'track.js' not in s:
                  s = s.replace('</body>', '<script src="/track.js?v=2" defer></script></body>', 1)
              if 'href="/privacy"' not in s:
                  s = s.replace('<a href="https://github.com/teerthsharma">GitHub</a>',
                                '<a href="https://github.com/teerthsharma">GitHub</a><a href="/privacy">Privacy</a>', 1)
              if s != o:
                  open(f, 'w').write(s)
          EOF
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "keep-tracking"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Restore reading analytics after deploy"
            git push
          fi
